# Raw hardware access (your startup tone)
pcm.raw0 {
    type hw
    card 0
    device 0
}

# Plugin layer (converts formats, your WAVs)
pcm.plug0 {
    type plug
    slave.pcm "raw0"
}

# Mixer layer (allows multiple apps)
pcm.dmix0 {
    type dmix
    ipc_key 1234
    slave {
        pcm "raw0"
        period_time 0
        period_size 1024
        buffer_size 4096
        rate 48000
        channels 2
    }
}

# Default = dmix (safe for everything)
pcm.!default {
    type plug
    slave.pcm "dmix0"
}

ctl.!default {
    type hw
    card 0
}

