<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParrotPi v0.1 🦜</title>

<style>
  /* Reset and body */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: sans-serif; 
    background: #1a1a2e; 
    color: #eee; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: flex-start;
    min-height: 100vh; 
    padding: 12px;
    gap: 10px;
  }

  h1 { font-size: 2rem; letter-spacing: 2px; color: #f4c542; text-align:center; }

  /* ── Parrot graphic 
  #parrot {
    width: 200px;
    height: 200px;
    background: url('/static/parrot.png') no-repeat center/contain;
    position: relative;
  }
── */

  /* ── Talk button ── */
  #holdButton {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: none;
    background: radial-gradient(circle at 40% 35%, #4caf50, #1b5e20);
    color: white;
    font-size: 1.1rem;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 0 0 6px #2e7d3280, 0 8px 32px #0007;
    transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #holdButton.active {
    background: radial-gradient(circle at 40% 35%, #ef5350, #b71c1c);
    box-shadow: 0 0 0 12px #ef535055, 0 8px 32px #0009;
    transform: scale(0.96);
  }

  /* ── VU meter ── */
  .meter-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .meter-wrap.visible { opacity: 1; }

  #vuMeter {
    width: 220px;
    height: 12px;
    background: #333;
    border-radius: 6px;
    overflow: hidden;
  }
  #vuBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #66bb6a, #f4c542, #ef5350);
    border-radius: 6px;
    transition: width 0.08s ease-out;
  }
  .meter-label { font-size: 0.75rem; color: #777; }
.quickBtn {
  padding: 10px 16px;
  font-size: 0.9rem;
  border-radius: 8px;
  cursor: pointer;
  background: #2d2d44;
  color: #eee;
  border: 1px solid #555;
  transition: background 0.15s, opacity 0.2s;
}
.quickBtn:hover {
  background: #3c3c5c;
}

/* Busy-lock: all lockable controls dim and stop responding */
.ctrl-btn:disabled,
.ctrl-btn.busy-locked {
  opacity: 0.35;
  cursor: not-allowed;
  pointer-events: none;
}
#holdButton:disabled,
#holdButton.busy-locked {
  opacity: 0.35;
  cursor: not-allowed;
  pointer-events: none;
}

#micRequestBtn {
  padding: 12px 24px;
  font-size: 1rem;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
  background: #7c4d00;
  color: #fff;
  border: 2px solid #f4c542;
  letter-spacing: 1px;
  transition: background 0.15s, border-color 0.15s;
}
#micRequestBtn:hover  { background: #a06000; }
#micRequestBtn.granted { background: #1b5e20; border-color: #4caf50; cursor: default; }
#micRequestBtn:disabled { opacity: 0.6; cursor: not-allowed; }

</style>
</head>
<body>

<div style="display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; justify-content:center;">
  <h1>🦜 ParrotPi</h1>
  <div id="statusLine" style="font-size:1rem; color:#aaa;">Status: initialising…</div>
</div>
<div id="parrot"></div>

<!-- VOLUME SLIDER -->
<div style="width:280px; display:flex; gap:8px; align-items:center; margin-top:4px;">
  <span style="font-size:0.8rem; color:#aaa; white-space:nowrap; width:36px;">vol</span>
  <input id="volumeSlider" type="range" min="0" max="100" value="50" step="5" style="flex:1;">
  <span id="volumeValue" style="width:36px; text-align:right; font-size:0.85rem;">50%</span>
</div>

<!-- PITCH SLIDER -->
<div style="width:280px; display:flex; gap:8px; align-items:center; margin-top:4px;">
  <span style="font-size:0.8rem; color:#aaa; white-space:nowrap; width:36px;">pitch</span>
  <input id="parrotSlider" type="range" min="5" max="90" value="20" step="5" style="flex:1;">
  <span id="parrotValue" style="width:36px; text-align:right; font-size:0.85rem;">+20%</span>
</div>
<button id="micRequestBtn" onclick="requestMic()">🎤 Enable Mic</button>
<button id="holdButton" class="ctrl-btn" disabled>HOLD TO<br>TALK (*)</button>

<div class="meter-wrap" id="meterWrap">
  <div id="vuMeter"><div id="vuBar"></div></div>
  <span class="meter-label">mic level</span>
</div>

<!-- QUICK PHRASES ROW -->
<div style="display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; justify-content:center;">
  <button onclick="sayPhrase('mombeatsme')" class="quickBtn ctrl-btn">She Beats Me</button>
  <button onclick="sayPhrase('Does He Talk')" class="quickBtn ctrl-btn">Does He Talk</button>
  <button onclick="sayPhrase('F#$@!!')" class="quickBtn ctrl-btn">F#$@!!</button>
  <button onclick="sayPhrase('Squawk3')" class="quickBtn ctrl-btn">Squawk3</button>
  <button onclick="sayPhrase('test')" class="quickBtn ctrl-btn">Replay(*)</button>
</div>

<!-- SERVO CONTROL ROW -->
<div style="display:flex; gap:12px; margin-top:14px; flex-wrap:wrap; justify-content:center;">
  <button onclick="headLeft()" class="quickBtn ctrl-btn">« head</button>
  <button onclick="beakClose()" class="quickBtn ctrl-btn">Beak Close</button>
  <button onclick="beakOpen()" class="quickBtn ctrl-btn">Beak Open</button>
  <button onclick="headRight()" class="quickBtn ctrl-btn">head »</button>
</div>

<!-- STOP / RESTART / SHUTDOWN BUTTONS -->
<div style="margin-top:24px; border-top:1px solid #333; padding-top:16px; width:100%; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
  <button id="stopBtn" onclick="stopAll()"
    style="padding:10px 22px; font-size:0.85rem; font-weight:bold; border-radius:8px;
           cursor:pointer; background:#c62828; color:#fff; border:2px solid #ff5252;
           letter-spacing:1px; box-shadow:0 0 14px #c6282866; transition:background 0.15s;">
    ⛔ Stop
  </button>
  <button id="restartBtn" onclick="restartServer()"
    style="padding:10px 22px; font-size:0.85rem; font-weight:bold; border-radius:8px;
           cursor:pointer; background:#4a0000; color:#ff8a80; border:1px solid #c62828;
           letter-spacing:1px; transition:background 0.15s;">
    ⟳ Restart
  </button>
  <button id="shutdownBtn" onclick="shutdownPi()"
    style="padding:10px 22px; font-size:0.85rem; font-weight:bold; border-radius:8px;
           cursor:pointer; background:#7b1fa2; color:#fff; border:2px solid #ce93d8;
           letter-spacing:1px; box-shadow:0 0 10px #7b1fa266; transition:background 0.15s;">
    ⏻ Shutdown
  </button>
</div>

<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"
        integrity="sha384-mZLF4UVrpi/QTWPA7BjNPEnkIfRFn4ZEO3Qt/HFklTJBj/gBOV8G3HcKn4NfQblz"
        crossorigin="anonymous"></script>

<script>
const socket = io();

// --------------------
// Audio Setup & PCM Worklet
// --------------------
let audioContext = new (window.AudioContext || window.webkitAudioContext)();
let pcmNode;

audioContext.audioWorklet.addModule("{{ url_for('static', filename='pcm-worklet.js') }}")
.then(() => {
    pcmNode = new AudioWorkletNode(audioContext, "pcm-processor");
    pcmNode.connect(audioContext.destination);

    socket.on("server_pcm", data => {
        if (pcmNode) pcmNode.port.postMessage(new Float32Array(data));
    });
})
.catch(err => console.error("Failed to load PCM Worklet:", err));

let micStream;
let micProcessor;
let micReady = false;
let hardwareBusy = false;
let micActive = false;
let holdButton = document.getElementById("holdButton");

async function requestMic() {
  const btn = document.getElementById("micRequestBtn");
  btn.disabled = true;
  btn.textContent = "Requesting…";
  // Resume AudioContext synchronously here while we're still inside the user gesture.
  // iOS Safari suspends AudioContext created outside a gesture and won't resume it
  // reliably once we cross an await boundary.
  audioContext.resume();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop()); // just needed the permission grant
    micReady = true;
    btn.textContent = "🎤 Mic Ready ✓";
    btn.classList.add("granted");
    holdButton.disabled = hardwareBusy; // enable hold-to-talk (unless parrot is busy)
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "🎤 Enable Mic (retry)";
    console.error("Mic permission denied:", err);
  }
}
let beak = document.getElementById("beak");
let meterWrap = document.getElementById("meterWrap");

// RMS Utility
function computeRMS(buffer) {
    let sum = 0;
    for (let i = 0; i < buffer.length; i++) sum += buffer[i] * buffer[i];
    return Math.sqrt(sum / buffer.length);
}

// Mic Capture & Streaming
async function startMic() {
  console.log("told to mic_start")
  // audioContext.resume() was already called synchronously in the pointerdown handler;
  // this is just a safety fallback for non-iOS browsers.
  audioContext.resume();
  try {
  if (!micStream) {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = audioContext.createMediaStreamSource(micStream);
    micProcessor = audioContext.createScriptProcessor(1024, 1, 1);
    source.connect(micProcessor);
    micProcessor.connect(audioContext.destination);

    micProcessor.onaudioprocess = (e) => {
        if (!micActive) return; // mic was stopped; ignore stale callbacks
        const input = e.inputBuffer.getChannelData(0);
        console.log("emitting mic_chunk with length:", input.length);
        socket.emit("mic_chunk", input.slice().buffer);
        const amp = computeRMS(input);

        meterWrap.classList.add("visible");
        const colorIntensity = Math.min(255, Math.floor(amp * 500));
        holdButton.style.background = `rgb(255, ${255 - colorIntensity}, 0)`;
        document.getElementById("vuBar").style.width = Math.min(amp*400,100)+'%';
    };
  }
  micActive = true;
  console.log("emitting mic_start")
  socket.emit("mic_start", { sampleRate: audioContext.sampleRate });
  } catch (err) {
    console.error("startMic failed:", err);
    holdButton.classList.remove("active");
    holdButton.style.background = "";
  }
}

function stopMic() {
    if (!micActive) return;
    micActive = false;
    console.log("told to stopMic")
    console.log("emitting mic_stop")
    socket.emit("mic_stop");
    if (micProcessor) micProcessor.disconnect();
    if (micStream) { micStream.getTracks().forEach(track => track.stop()); micStream = null; }
    holdButton.classList.remove("active");
    holdButton.style.background = `radial-gradient(circle at 40% 35%, #4caf50, #1b5e20)`;
    meterWrap.classList.remove("visible");
    document.getElementById("vuBar").style.width = "0%";
}

function initUI() {
  const holdButton = document.getElementById("holdButton");
  const micGainSlider = document.getElementById("micGainSlider");
  const micGainValue = document.getElementById("micGainValue");
  const parrotSlider = document.getElementById("parrotSlider");
  const parrotValue = document.getElementById("parrotValue");

holdButton.addEventListener("pointerdown", (e) => {
    holdButton.setPointerCapture(e.pointerId);
    audioContext.resume(); // synchronous within gesture — required for iOS Safari
    holdButton.classList.add("active");
    startMic();
});

holdButton.addEventListener("pointerup", () => {
    holdButton.classList.remove("active");
    stopMic();
});

holdButton.addEventListener("pointercancel", () => {
    holdButton.classList.remove("active");
    stopMic();
});

  if (micGainSlider && micGainValue) {
    micGainSlider.addEventListener("input", () => {
      const gain = parseInt(micGainSlider.value);
      micGainValue.textContent = gain + "x";
      socket.emit("mic_gain", gain);
    });
  }

  if (parrotSlider && parrotValue) {
    parrotSlider.addEventListener("input", () => {
      const pct = parseInt(parrotSlider.value);
      parrotValue.textContent = "+" + pct + "%";
      setParrot(pct);
    });
  }

  const volumeSlider = document.getElementById("volumeSlider");
  const volumeValue  = document.getElementById("volumeValue");
  if (volumeSlider && volumeValue) {
    volumeSlider.addEventListener("input", () => {
      const vol = parseInt(volumeSlider.value);
      volumeValue.textContent = vol + "%";
      setVolume(vol);
    });
  }
}

async function refreshVolume() {
  try {
    const res = await fetch('/volume');
    const data = await res.json();
    const vol = data.volume;
    document.getElementById("volumeSlider").value = vol;
    document.getElementById("volumeValue").textContent = vol + "%";
  } catch (err) {
    console.error("Failed to get volume:", err);
  }
}

async function setVolume(percent) {
  try {
    const res = await fetch(`/volume/${percent}`, { method: 'POST' });
    const data = await res.json();
    document.getElementById("volumeSlider").value = data.volume;
    document.getElementById("volumeValue").textContent = data.volume + "%";
  } catch (err) {
    console.error("Failed to set volume:", err);
  }
}

async function refreshParrot() {
  try {
    const res = await fetch('/parrot');
    const data = await res.json();
    const pct = data.parrot;
    parrotSlider.value = pct;
    parrotValue.textContent = "+" + pct + "%";
  } catch (err) {
    console.error("Failed to get parrot pitch:", err);
  }
}

async function setParrot(pct) {
  try {
    const res = await fetch(`/parrot/${pct}`, { method: 'POST' });
    const data = await res.json();
    const newPct = data.parrot;
    parrotSlider.value = newPct;
    parrotValue.textContent = "+" + newPct + "%";
  } catch (err) {
    console.error("Failed to set parrot pitch:", err);
  }
}

function sayPhrase(text) {
  console.log("Phrase:", text);
  fetch('/say', {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ phrase: text })
  });
}

function headLeft() {
  fetch('/servo/head/left', { method: "POST" });
}

function headRight() {
  fetch('/servo/head/right', { method: "POST" });
}

function beakClose() {
  fetch('/servo/beak/close', { method: "POST" });
}

function beakMid() {
  fetch('/servo/beak/mid', { method: "POST" });
}

function beakOpen() {
  fetch('/servo/beak/open', { method: "POST" });
}
function setHardwareStatus(busy, reason) {
  hardwareBusy = busy;
  const statusLine = document.getElementById("statusLine");
  if (statusLine) {
    const statusText = busy ? `Busy (${reason})` : "Ready";
    statusLine.textContent = `Status: ${statusText}`;
    document.title = `ParrotPi: ${statusText}`;
  }
  // Lock or unlock all ctrl-btn elements (STOP button is excluded — no ctrl-btn class)
  // holdButton also requires mic permission before it can be enabled.
  // Never disable holdButton while mic is active — iOS Safari won't fire pointerup on a disabled element,
  // which would leave the mic running forever.
  document.querySelectorAll(".ctrl-btn").forEach(btn => {
    if (btn.id === "holdButton") {
      btn.disabled = (busy || !micReady) && !micActive;
    } else {
      btn.disabled = busy;
    }
  });
}

async function refreshHardwareStatus() {
  try {
    const res = await fetch('/hardware_status');
    const data = await res.json();
    const busy = data.busy;
    let reason = "idle";
    if (busy) {
      if (data.mic_active) reason = "mic";
      else if (data.beak_moving) reason = "beak";
      else if (data.queue_size > 0) reason = "audio";
      else reason = "busy";
    }
    setHardwareStatus(busy, reason);
  } catch (err) {
    console.error("hardware status fetch failed:", err);
  }
}

async function shutdownPi() {
  if (!confirm("Shut down the Raspberry Pi?\nYou will need physical access to turn it back on.")) return;
  const btn = document.getElementById("shutdownBtn");
  btn.textContent = "Shutting down…";
  btn.disabled = true;
  try {
    await fetch('/shutdown', { method: 'POST' });
  } catch (_) {}
  document.getElementById("statusLine").textContent = "Status: Pi shutting down…";
}

async function restartServer() {
  if (!confirm("Restart the ParrotPi server?")) return;
  const btn = document.getElementById("restartBtn");
  btn.textContent = "Restarting…";
  btn.disabled = true;
  try {
    await fetch('/restart', { method: 'POST' });
  } catch (_) {}
  // Poll until the server comes back, then reload the page
  const poll = setInterval(async () => {
    try {
      await fetch('/');
      clearInterval(poll);
      window.location.reload();
    } catch (_) {}
  }, 1500);
}

async function stopAll() {
  try {
    stopMic();  // kill local mic stream immediately
    await fetch('/stop', { method: 'POST' });
    // Force an immediate status refresh so buttons unlock right away
    await refreshHardwareStatus();
  } catch (err) {
    console.error("stop failed:", err);
  }
}

// Initialize UI and load current settings on page startup
window.addEventListener("load", () => {
  initUI();
  refreshVolume();
  refreshParrot();
  refreshHardwareStatus();
  setInterval(refreshHardwareStatus, 2000);
});

</script>
</body>
</html>
