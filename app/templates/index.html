<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParrotPi Control</title>

<style>
  body { font-family: sans-serif; background: #eef; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  #holdButton { 
    width: 150px; height: 50px; font-size: 16px; border: none; border-radius: 8px; 
    background: linear-gradient(90deg, #ffcc00, #ff9900); color: white; cursor: pointer; 
    transition: transform 0.1s, background 0.1s;
  }
  #holdButton.active { transform: scale(1.1); }
  #parrot { 
    width: 200px; height: 200px; margin-top: 30px; 
    background: url('/static/parrot.png') no-repeat center/contain; 
    position: relative;
  }
  #beak { 
    width: 40px; height: 20px; background: red; position: absolute; top: 100px; left: 80px; 
    border-radius: 4px; transform-origin: top center; 
    transition: transform 0.05s;
  }
</style>
</head>
<body>

<h1>ParrotPi Animatronic</h1>
<button id="holdButton">Hold to Talk</button>

<div id="parrot">
  <div id="beak"></div>
</div>

<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"
        integrity="sha384-mZLF4UVrpi/QTWPA7BjNPEnkIfRFn4ZEO3Qt/HFklTJBj/gBOV8G3HcKn4NfQblz"
        crossorigin="anonymous"></script>

<script>
const socket = io();

// --------------------
// Audio Setup
// --------------------
let audioContext = new (window.AudioContext || window.webkitAudioContext)();
let pcmNode;

// Load PCM Worklet
audioContext.audioWorklet.addModule("{{ url_for('static', filename='pcm-worklet.js') }}")
.then(() => {
    pcmNode = new AudioWorkletNode(audioContext, "pcm-processor");
    pcmNode.connect(audioContext.destination);

    socket.on("server_pcm", data => {
        if (pcmNode) {
            pcmNode.port.postMessage(new Float32Array(data));
        }
    });
})
.catch(err => console.error("Failed to load PCM Worklet:", err));

let micStream;
let micProcessor;
let holdButton = document.getElementById("holdButton");
let beak = document.getElementById("beak");

// --------------------
// RMS Utility
// --------------------
function computeRMS(buffer) {
    let sum = 0;
    for (let i = 0; i < buffer.length; i++) sum += buffer[i] * buffer[i];
    return Math.sqrt(sum / buffer.length);
}

// --------------------
// Mic Capture & Streaming
// --------------------
async function startMic() {
  await audioContext.resume();

    if (!micStream) {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioContext.createMediaStreamSource(micStream);
        micProcessor = audioContext.createScriptProcessor(1024, 1, 1);

        source.connect(micProcessor);
        micProcessor.connect(audioContext.destination);

        micProcessor.onaudioprocess = (e) => {
          console.log("onaudioprocess fired");

            const input = e.inputBuffer.getChannelData(0);
                      console.log(input.slice(0, 10));

          console.log("audio firing", input[0]);

            //socket.emit("mic_chunk", { audio: input.buffer });
            socket.emit("mic_chunk", { audio: input.slice() });
            const amp = computeRMS(input);
            beak.style.transform = `scaleY(${0.5 + amp * 5})`;

            const colorIntensity = Math.min(255, Math.floor(amp * 500));
            holdButton.style.background = `rgb(255, ${255 - colorIntensity}, 0)`;
        };
    }
    socket.emit("mic_start");
}

function stopMic() {
    socket.emit("mic_stop");
    if (micProcessor) micProcessor.disconnect();
    if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
    }

    beak.style.transform = `scaleY(0.5)`;
    holdButton.style.background = `linear-gradient(90deg, #ffcc00, #ff9900)`;
}

// --------------------
// Button Events
// --------------------
holdButton.addEventListener("mousedown", () => {
    holdButton.classList.add("active");
    startMic();
});
holdButton.addEventListener("mouseup", () => {
    holdButton.classList.remove("active");
    stopMic();
});
holdButton.addEventListener("mouseleave", () => {
    holdButton.classList.remove("active");
    stopMic();
});
</script>

</body>
</html>
