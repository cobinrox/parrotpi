<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ParrotPi 🦜</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 32px;
    }

    h1 { font-size: 2rem; letter-spacing: 2px; color: #f4c542; }

    /* ── Talk button ── */
    #talkBtn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 40% 35%, #4caf50, #1b5e20);
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 0 6px #2e7d3280, 0 8px 32px #0007;
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* needed for mobile pointer events */
    }

    #talkBtn:active,
    #talkBtn.active {
      background: radial-gradient(circle at 40% 35%, #ef5350, #b71c1c);
      box-shadow: 0 0 0 12px #ef535055, 0 8px 32px #0009;
      transform: scale(0.96);
    }

    #talkBtn:disabled {
      background: radial-gradient(circle at 40% 35%, #555, #333);
      cursor: not-allowed;
    }

    /* ── Status ── */
    #status {
      font-size: 0.95rem;
      color: #aaa;
      height: 1.4em;
      letter-spacing: 0.5px;
    }

    #status.on  { color: #ef5350; }
    #status.ok  { color: #66bb6a; }
    #status.err { color: #ff7043; }

    /* ── VU meter ── */
    .meter-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .meter-wrap.visible { opacity: 1; }

    #vuMeter {
      width: 220px;
      height: 12px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
    }
    #vuBar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #66bb6a, #f4c542, #ef5350);
      border-radius: 6px;
      transition: width 0.08s ease-out;
    }
    .meter-label { font-size: 0.75rem; color: #777; }

    /* ── Control buttons ── */
    .controls {
      display: flex;
      gap: 16px;
    }
    .ctrl-btn {
      padding: 10px 24px;
      border: 2px solid #f4c54280;
      background: transparent;
      color: #f4c542;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .ctrl-btn:hover { background: #f4c54218; }
  </style>
</head>
<body>

  <h1>🦜 ParrotPi</h1>

  <button id="talkBtn">HOLD TO<br>TALK</button>

  <div id="status">Connecting…</div>

  <div class="meter-wrap" id="meterWrap">
    <div id="vuMeter"><div id="vuBar"></div></div>
    <span class="meter-label">mic level</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="moveHead('left')">◀ Left</button>
    <button class="ctrl-btn" onclick="moveHead('right')">Right ▶</button>
    <button class="ctrl-btn" onclick="playClip('cracker')">🦜 Cracker!</button>
    <button class="ctrl-btn" onclick="playClip('hi')">👋 Hi!</button>
  </div>

<script>
// ── Socket connection ─────────────────────────────────────────────────────────
const socket = io();   // connects back to the Flask server that served this page

const talkBtn   = document.getElementById('talkBtn');
const statusEl  = document.getElementById('status');
const vuBar     = document.getElementById('vuBar');
const meterWrap = document.getElementById('meterWrap');

socket.on('connect',    () => setStatus('Connected ✓', 'ok'));
socket.on('disconnect', () => setStatus('Disconnected', 'err'));

function setStatus(msg, cls = '') {
  statusEl.textContent = msg;
  statusEl.className = cls;
}

// ── Audio state ───────────────────────────────────────────────────────────────
let audioCtx      = null;
let mediaStream   = null;
let scriptProc    = null;   // ScriptProcessorNode (broadly supported)
let isTalking     = false;

const SAMPLE_RATE  = 16000;   // must match server
const BUFFER_SIZE  = 1024;    // ScriptProcessor buffer; ~64ms at 16 kHz

// ── Mic start ─────────────────────────────────────────────────────────────────
async function startMic() {
  if (isTalking) return;
  isTalking = true;
  talkBtn.classList.add('active');
  meterWrap.classList.add('visible');

  try {
    // Request mic access
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

    // Build audio graph: mic → resample to 16 kHz → ScriptProcessor → chunks
    audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
    const source = audioCtx.createMediaStreamSource(mediaStream);

    scriptProc = audioCtx.createScriptProcessor(BUFFER_SIZE, 1, 1);
    source.connect(scriptProc);
    scriptProc.connect(audioCtx.destination); // must be connected to run

    socket.emit('mic_start');
    setStatus('🔴 Talking…', 'on');

    scriptProc.onaudioprocess = (e) => {
      if (!isTalking) return;

      const samples = e.inputBuffer.getChannelData(0); // Float32Array
      socket.emit('mic_chunk', { audio: Array.from(samples) });

      // VU meter: RMS level
      let sum = 0;
      for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
      const rms = Math.sqrt(sum / samples.length);
      vuBar.style.width = Math.min(rms * 400, 100) + '%';
    };

  } catch (err) {
    isTalking = false;
    talkBtn.classList.remove('active');
    meterWrap.classList.remove('visible');
    setStatus('Mic error: ' + err.message, 'err');
    console.error(err);
  }
}

// ── Mic stop ──────────────────────────────────────────────────────────────────
function stopMic() {
  if (!isTalking) return;
  isTalking = false;
  talkBtn.classList.remove('active');
  meterWrap.classList.remove('visible');
  vuBar.style.width = '0%';

  // Tear down audio graph
  if (scriptProc) { scriptProc.disconnect(); scriptProc = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  if (audioCtx)   { audioCtx.close(); audioCtx = null; }

  socket.emit('mic_stop');
  setStatus('Connected ✓', 'ok');
}

// ── Button events (mouse + touch for mobile) ──────────────────────────────────
talkBtn.addEventListener('pointerdown',  (e) => { e.preventDefault(); startMic(); });
talkBtn.addEventListener('pointerup',   (e) => { e.preventDefault(); stopMic();  });
talkBtn.addEventListener('pointerleave',(e) => { if (isTalking) stopMic(); });

// Safety net: if user tabs away while holding
document.addEventListener('visibilitychange', () => {
  if (document.hidden && isTalking) stopMic();
});

// ── Other controls ────────────────────────────────────────────────────────────
function moveHead(direction) {
  fetch(`/move/${direction}`).catch(console.error);
}

function playClip(name) {
  fetch(`/play/${name}`).catch(console.error);
}
</script>
</body>
</html>
