# Hardware access
pcm.raw0 {
    type hw
    card 0
}

# Dmix - allows MULTIPLE apps to share device simultaneously
pcm.dmix0 {
    type dmix
    ipc_key 1234
    slave {
        pcm "raw0"
        period_time 0
        period_size 1024
        buffer_size 4096
        rate 48000
        channels 2
    }
}

# Default = everything uses dmix
pcm.!default {
    type plug
    slave.pcm "dmix0"
}

ctl.!default {
    type hw
    card 0
}

